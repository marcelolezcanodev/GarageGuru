<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Recibo</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1, h2 { color: #000; }
        ul { list-style-type: none; padding: 0; }
        ul li { padding: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; text-align: left; padding: 8px; }
        th { background-color: #ccc; color: black; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .total { font-weight: bold; background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Acumuladores Rinde S.A.</h1>
        <ul>
            <li><strong>Recibo Nº</strong> 1234567</li>
            <li><strong>Fecha:</strong> 26/07/2024</li>
            <li><strong>Cliente:</strong> Marcelo Lezcano</li>
        </ul>

        <table>
            <thead>
                <tr>
                    <th>Factura</th>
                    <th>Monto Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>001-001-1234569</td>
                    <td>660.000</td>
                </tr>
                <tr>
                    <td>001-001-1234568</td>
                    <td>440.000</td>
                </tr>
                <tr class="total">
                    <td>Total</td>
                    <td>1.100.000</td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
</html>
