<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas por Producto</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1, h2 { color: #333; }
        ul { list-style-type: none; padding: 0; }
        ul li { padding: 5px 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; text-align: left; padding: 8px; }
        th { background-color: #ccc; color: black; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .total { font-weight: bold; background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Acumuladores Rinde S.A.</h1>
        <h2>Reporte de Ventas por Producto</h2>
        <ul>
            <li><strong>Periodo:</strong> 01/07/2024 <strong>al</strong> 31/07/2024</li>
        </ul>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad Vendida</th>
                    <th>Ingresos</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Aceite de motor</td>
                    <td>500</td>
                    <td>2,500,000</td>
                </tr>
                <tr>
                    <td>Filtro</td>
                    <td>300</td>
                    <td>1,200,000</td>
                </tr>
                <tr class="total">
                    <td>Total</td>
                    <td>800</td>
                    <td>3,700,000</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
